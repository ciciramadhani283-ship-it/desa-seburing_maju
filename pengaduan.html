<section class="container">

    <div class="title">

        <h2>Pengaduan Masyarakat</h2>

        <p>
            Sampaikan pengaduan, kritik, dan saran
            untuk kemajuan Desa Seburing Maju.
        </p>

    </div>

    <div class="form-box">

        <form id="formPengaduan">

            <label>Nama</label>

            <input
                type="text"
                id="nama"
                placeholder="Masukkan nama Anda"
            >

            <label>Kategori Pengaduan</label>

            <select id="kategori">

                <option value="">
                    -- Pilih Kategori --
                </option>

                <option>Infrastruktur</option>

                <option>Pelayanan Desa</option>

                <option>Lingkungan</option>

                <option>Keamanan</option>

                <option>Lainnya</option>

            </select>

            <label>Isi Pengaduan</label>

            <textarea
                id="isi"
                placeholder="Tuliskan pengaduan Anda..."
            ></textarea>

            <button
                type="button"
                onclick="kirimPengaduan()"
            >
                Kirim Pengaduan
            </button>

        </form>

    </div>

</section>
