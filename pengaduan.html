<!-- =========================
     PENGADUAN
========================= -->

<section class="container">


    <div class="title">

        <h2>
            Pengaduan Masyarakat
        </h2>

        <p>
            Sampaikan pengaduan, kritik, dan saran
            untuk kemajuan Desa Seburing Maju.
        </p>

    </div>



    <div class="form-box">


        <form id="formPengaduan">


            <!-- NAMA -->

            <label for="nama">
                Nama
            </label>

            <input
                type="text"
                id="nama"
                name="nama"
                placeholder="Masukkan nama Anda"
                required
            >



            <!-- KATEGORI -->

            <label for="kategori">
                Kategori Pengaduan
            </label>

            <select
                id="kategori"
                name="kategori"
                required
            >

                <option value="">
                    -- Pilih Kategori --
                </option>

                <option value="Infrastruktur">
                    Infrastruktur
                </option>

                <option value="Pelayanan Desa">
                    Pelayanan Desa
                </option>

                <option value="Lingkungan">
                    Lingkungan
                </option>

                <option value="Keamanan">
                    Keamanan
                </option>

                <option value="Lainnya">
                    Lainnya
                </option>

            </select>



            <!-- ISI PENGADUAN -->

            <label for="isi">
                Isi Pengaduan
            </label>

            <textarea
                id="isi"
                name="isi_pengaduan"
                placeholder="Tuliskan pengaduan Anda..."
                required
            ></textarea>



            <!-- TOMBOL -->

            <button
                type="submit"
                id="btnKirim"
            >
                Kirim Pengaduan
            </button>


        </form>


        <!-- PESAN -->

        <div
            id="pesan"
            style="margin-top: 15px;"
        ></div>


    </div>


</section>



<!-- =========================
     FOOTER
========================= -->

<footer>

    © 2026 Desa Seburing Maju

</footer>



<script>


// ==================================================
// API GOOGLE APPS SCRIPT
// ==================================================

const API_URL =
"https://script.google.com/macros/s/AKfycbywegBy98GOQxDyWtociUqRnRGBqcs5AnKL5wyGyXudi-I-0DWAY5TgDvrw84DfBRQWew/exec";



// ==================================================
// FORM PENGADUAN
// ==================================================

document
.getElementById("formPengaduan")
.addEventListener("submit", async function(event) {

    event.preventDefault();


    // Ambil data

    const nama =
        document.getElementById("nama").value.trim();

    const kategori =
        document.getElementById("kategori").value;

    const isi =
        document.getElementById("isi").value.trim();


    const tombol =
        document.getElementById("btnKirim");

    const pesan =
        document.getElementById("pesan");



    // ==================================================
    // VALIDASI
    // ==================================================

    if (nama === "") {

        alert("Nama harus diisi!");

        return;
    }


    if (kategori === "") {

        alert("Silakan pilih kategori pengaduan!");

        return;
    }


    if (isi === "") {

        alert("Isi pengaduan harus diisi!");

        return;
    }



    // ==================================================
    // TOMBOL LOADING
    // ==================================================

    tombol.disabled = true;

    tombol.innerText = "Mengirim...";

    pesan.innerHTML = "";



    // ==================================================
    // DATA YANG DIKIRIM
    // ==================================================

    const data = {

        nama: nama,

        kategori: kategori,

        isi_pengaduan: isi

    };



    // ==================================================
    // KIRIM KE GOOGLE APPS SCRIPT
    // ==================================================

    try {

        const response =
            await fetch(API_URL, {

                method: "POST",

                body: JSON.stringify(data)

            });


        const hasil =
            await response.json();



        // ==================================================
        // BERHASIL
        // ==================================================

        if (hasil.success) {

            pesan.innerHTML = `
                <div style="
                    padding:15px;
                    background:#d4edda;
                    color:#155724;
                    border-radius:8px;
                ">
                    <strong>Pengaduan berhasil dikirim!</strong>
                    <br>
                    ID Pengaduan:
                    ${hasil.id}
                </div>
            `;


            // Kosongkan form

            document
                .getElementById("formPengaduan")
                .reset();

        }


        // ==================================================
        // GAGAL
        // ==================================================

        else {

            pesan.innerHTML = `
                <div style="
                    padding:15px;
                    background:#f8d7da;
                    color:#721c24;
                    border-radius:8px;
                ">
                    Pengaduan gagal dikirim.
                    <br>
                    ${hasil.message}
                </div>
            `;

        }


    }

    catch(error) {

        console.error(error);


        pesan.innerHTML = `
            <div style="
                padding:15px;
                background:#f8d7da;
                color:#721c24;
                border-radius:8px;
            ">
                Terjadi kesalahan saat mengirim
                pengaduan.
                <br><br>
                Silakan coba lagi.
            </div>
        `;

    }


    // ==================================================
    // KEMBALIKAN TOMBOL
    // ==================================================

    tombol.disabled = false;

    tombol.innerText = "Kirim Pengaduan";


});

</script>


</body>
